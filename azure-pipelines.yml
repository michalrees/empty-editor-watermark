# Microsoft Entra workload identity federation; publishing requires Publisher membership.
# Main commits run checks; matching version tags publish automatically.
trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*
pr: none

parameters:
  - name: extensionDirectory
    type: string
    default: '.'
  - name: serviceConnection
    type: string
    default: 'vscode-marketplace-oidc'
  - name: publish
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

steps:
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: Set up Node.js

  - script: |
      set -eu
      node <<'JS'
      const fs = require('fs');
      const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
      const ref = process.env.BUILD_SOURCEBRANCH;
      if (ref.startsWith('refs/tags/')) {
        if (ref !== `refs/tags/v${version}`) {
          throw new Error(`Tag ${ref} does not match package version ${version}`);
        }
      }
      JS
    workingDirectory: '${{ parameters.extensionDirectory }}'
    displayName: Check release tag matches extension version

  - script: |
      set -eu
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi
      npm run check
      npx --yes @vscode/vsce package --no-dependencies --out "$(Build.ArtifactStagingDirectory)/extension.vsix"
    workingDirectory: '${{ parameters.extensionDirectory }}'
    displayName: Build and package extension

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: vsix
    displayName: Save VSIX for review

  - task: AzureCLI@2
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'), and(eq(variables['Build.Reason'], 'Manual'), ${{ eq(parameters.publish, true) }})))
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '${{ parameters.extensionDirectory }}'
      inlineScript: |
        set -eu
        test -n '${{ parameters.serviceConnection }}'
        unset VSCE_PAT
        npx --yes @vscode/vsce publish --packagePath "$(Build.ArtifactStagingDirectory)/extension.vsix" --azure-credential
    displayName: Publish using Microsoft Entra ID
