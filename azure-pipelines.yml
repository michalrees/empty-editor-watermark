# Legacy manual build fallback. GitHub Actions is the primary workflow.
# No subscription, managed identity, service connection or automatic upload is used.
trigger: none
pr: none
pool:
  vmImage: ubuntu-24.04
steps:
  - task: UseNode@1
    inputs:
      version: '22.x'
  - script: npm ci
    displayName: Install locked dependencies
  - script: node tools/prepare-release.cjs
    displayName: Check and package only
  - task: CopyFiles@2
    inputs:
      contents: |
        *.vsix
        *.vsix.sha256
      targetFolder: '$(Build.ArtifactStagingDirectory)'
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: vsix
