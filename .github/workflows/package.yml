name: Build Marketplace package
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check and package (no Marketplace upload)
        run: node tools/prepare-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error
          retention-days: 30
